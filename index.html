<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="スクショ整理">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="スクリーンショットを自動でOCR→分類→整理するアプリ">
  
  <title>スクショ整理くん</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e8e8e8;
      overflow-x: hidden;
    }
    
    /* iOS Safari用のセーフエリア対応 */
    header {
      padding-top: max(14px, env(safe-area-inset-top));
    }
    
    /* ヘッダー */
    header {
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      font-size: 18px;
    }
    
    .logo h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff 0%, #a8b4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo p {
      font-size: 10px;
      color: #666;
    }
    
    .upload-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.2s;
    }
    
    .upload-btn:active {
      transform: scale(0.97);
    }
    
    /* メインレイアウト */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      min-height: calc(100vh - 70px);
      min-height: calc(100dvh - 70px);
    }
    
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .sidebar {
        position: static !important;
        padding: 12px;
      }
      .folder-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .folder-btn {
        flex: none;
        padding: 8px 12px;
        font-size: 12px;
      }
      .folder-btn .name {
        display: none;
      }
      .folder-btn .icon {
        margin-right: 0;
      }
      .folder-btn .count {
        margin-left: 4px;
      }
      .folder-title {
        display: none;
      }
      .sub-filter {
        padding: 10px 12px;
      }
      .sub-tags {
        gap: 4px;
      }
      .sub-tag {
        padding: 5px 10px;
        font-size: 11px;
      }
    }
    
    /* サイドバー */
    .sidebar {
      background: rgba(255,255,255,0.02);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.04);
      height: fit-content;
      position: sticky;
      top: 85px;
    }
    
    .folder-title {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      padding-left: 4px;
    }
    
    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .folder-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: #888;
      cursor: pointer;
      font-size: 12px;
      text-align: left;
      transition: all 0.15s;
      width: 100%;
    }
    
    .folder-btn:active {
      transform: scale(0.98);
    }
    
    .folder-btn.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
      color: #fff;
    }
    
    .folder-btn .icon {
      font-size: 14px;
    }
    
    .folder-btn .name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .folder-btn .count {
      font-size: 10px;
      color: #555;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 6px;
      min-width: 20px;
      text-align: center;
    }
    
    .folder-btn.active .count {
      background: rgba(255,255,255,0.15);
      color: #aaa;
    }

    /* メインエリア */
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 中ジャンルフィルター */
    .sub-filter {
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .sub-filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .sub-filter-title {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sub-filter-clear {
      font-size: 10px;
      color: #667eea;
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .sub-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .sub-tag {
      padding: 5px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      font-size: 11px;
      color: #777;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sub-tag:active {
      transform: scale(0.96);
    }

    .sub-tag.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3) 0%, rgba(118, 75, 162, 0.3) 100%);
      border-color: rgba(102, 126, 234, 0.4);
      color: #fff;
    }

    /* 検索バー */
    .search-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1;
    }
    
    .search-box input {
      width: 100%;
      padding: 9px 10px 9px 34px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .search-box input:focus {
      border-color: rgba(102, 126, 234, 0.4);
    }
    
    .search-box input::placeholder {
      color: #555;
    }
    
    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
    }

    .result-count {
      font-size: 11px;
      color: #555;
      white-space: nowrap;
    }
    
    /* メインコンテンツ */
    .main-content {
      min-height: 300px;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 45vh;
      color: #555;
    }
    
    .empty-state svg {
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    .empty-state p:first-of-type {
      font-size: 15px;
      margin-bottom: 4px;
      color: #777;
    }
    
    .empty-state p:last-of-type {
      font-size: 12px;
    }
    
    /* カードグリッド */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }
    
    @media (max-width: 500px) {
      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
      }
      .card-image { height: 100px; }
      .card-body { padding: 10px; }
      .card-title { font-size: 12px; }
      .card-summary { font-size: 10px; display: none; }
    }
    
    .card {
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
      transition: all 0.2s;
      animation: fadeIn 0.3s ease;
    }
    
    .card:active {
      transform: scale(0.98);
    }
    
    .card-image {
      height: 120px;
      background: #0a0a0f;
      position: relative;
      overflow: hidden;
    }
    
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    
    .card-categories {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      max-width: calc(100% - 16px);
    }

    .card-category {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .card-sub-category {
      position: absolute;
      bottom: 8px;
      left: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 9px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #ccc;
    }
    
    .card-body {
      padding: 12px;
    }
    
    .card-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .card-summary {
      font-size: 11px;
      color: #666;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-tags {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      flex: 1;
    }
    
    .card-tag {
      font-size: 9px;
      color: #555;
      background: rgba(255,255,255,0.04);
      padding: 2px 5px;
      border-radius: 3px;
    }
    
    .card-date {
      font-size: 9px;
      color: #444;
    }
    
    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .modal {
      background: linear-gradient(135deg, #141420 0%, #1a1a2e 100%);
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      max-height: 85vh;
      overflow: auto;
      border: 1px solid rgba(255,255,255,0.08);
      transform: scale(0.95);
      transition: transform 0.3s;
    }
    
    .modal-overlay.active .modal {
      transform: scale(1);
    }
    
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      position: sticky;
      top: 0;
      background: linear-gradient(135deg, #141420 0%, #1a1a2e 100%);
      z-index: 10;
    }
    
    .modal-categories {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
    }

    .modal-category {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .modal-sub-cat {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(255,255,255,0.08);
      color: #aaa;
    }
    
    .modal-actions {
      display: flex;
      gap: 6px;
    }
    
    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 6px;
      color: #aaa;
      cursor: pointer;
      font-size: 12px;
      margin-right: auto;
    }

    .back-btn:active {
      transform: scale(0.97);
    }

    .delete-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 12px;
      background: rgba(255,80,80,0.15);
      border: none;
      border-radius: 6px;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 11px;
    }

    .close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      font-size: 16px;
    }
    
    .modal-content {
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    
    @media (max-width: 600px) {
      .modal-content {
        grid-template-columns: 1fr;
      }
    }
    
    .modal-image img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    
    .modal-info h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    
    .info-section {
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    
    .info-label {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
      color: #666;
      font-size: 10px;
    }
    
    .info-text {
      font-size: 12px;
      line-height: 1.5;
      color: #bbb;
    }
    
    .info-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    
    .info-tag {
      font-size: 11px;
      color: #fff;
      background: rgba(102, 126, 234, 0.25);
      padding: 4px 8px;
      border-radius: 4px;
    }
    
    .ocr-text {
      font-size: 11px;
      line-height: 1.5;
      color: #888;
      max-height: 100px;
      overflow: auto;
      white-space: pre-wrap;
    }

    .modal-date {
      font-size: 10px;
      color: #444;
      margin-top: 10px;
    }
    
    /* 処理中オーバーレイ */
    .processing-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 400;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    
    .processing-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .processing-box {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      border-radius: 50%;
      border: 3px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .processing-text {
      font-size: 13px;
      color: #ccc;
    }
    
    #file-input {
      display: none;
    }

    /* インストールバナー */
    .install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 200;
      animation: slideUp 0.3s ease;
    }

    .install-banner.show {
      display: block;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .install-banner-inner {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .install-banner p {
      font-size: 13px;
      font-weight: 500;
    }

    .install-banner-btns {
      display: flex;
      gap: 8px;
    }

    .install-btn {
      padding: 8px 16px;
      background: white;
      color: #764ba2;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .install-dismiss {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- ヘッダー -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">📷</div>
        <div>
          <h1>スクショ整理くん</h1>
          <p id="total-count">0件のスクショ</p>
        </div>
      </div>
      <label class="upload-btn" for="file-input">
        ✨ 追加
      </label>
      <input type="file" id="file-input" accept="image/*" multiple>
    </div>
  </header>

  <!-- 処理中オーバーレイ -->
  <div class="processing-overlay" id="processing-overlay">
    <div class="processing-box">
      <div class="spinner"></div>
      <p class="processing-text" id="processing-text">処理中...</p>
    </div>
  </div>

  <!-- メインコンテナ -->
  <div class="container">
    <!-- サイドバー（大ジャンル） -->
    <aside class="sidebar">
      <h3 class="folder-title">カテゴリ</h3>
      <div class="folder-list" id="folder-list"></div>
    </aside>

    <!-- メインエリア -->
    <div class="main-area">
      <!-- 中ジャンルフィルター -->
      <div class="sub-filter">
        <div class="sub-filter-header">
          <span class="sub-filter-title">絞り込み</span>
          <button class="sub-filter-clear" id="clear-sub">クリア</button>
        </div>
        <div class="sub-tags" id="sub-tags"></div>
      </div>

      <!-- 検索バー -->
      <div class="search-bar">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" id="search-input" placeholder="検索...">
        </div>
        <span class="result-count" id="result-count">0件</span>
      </div>

      <!-- カード一覧 -->
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <button class="back-btn" id="back-btn" onclick="closeModal()">← 戻る</button>
        <div class="modal-categories" id="modal-categories"></div>
        <div class="modal-actions">
          <button class="delete-btn" id="delete-btn">🗑️ 削除</button>
          <button class="close-btn" id="close-btn">×</button>
        </div>
      </div>
      <div class="modal-content">
        <div class="modal-image">
          <img id="modal-image" src="" alt="">
        </div>

    // ============================================
    // OCR分析
    // ============================================
    function analyzeText(ocrText) {
      var text = ocrText.toLowerCase();
      var detectedSubs = [];
      var entries = Object.entries(SUB_KEYWORDS);

      for (var i = 0; i < entries.length; i++) {
        var subCat = entries[i][0];
        var keywords = entries[i][1];
        var matched = false;

        for (var j = 0; j < keywords.length; j++) {
          if (text.indexOf(keywords[j].toLowerCase()) !== -1) {
            matched = true;
            break;
          }
        }

        if (matched) {
          detectedSubs.push(subCat);
        }
      }

      if (detectedSubs.length === 0) {
        detectedSubs.push('ひらめき・メモ');
      }

      var majorCats = [];
      var majorSet = {};
      for (var k = 0; k < detectedSubs.length; k++) {
        var sub = detectedSubs[k];
        var majors = SUB_TO_MAJOR[sub] || ['💭 プライベート'];
        for (var m = 0; m < majors.length; m++) {
          if (!majorSet[majors[m]]) {
            majorSet[majors[m]] = true;
            majorCats.push(majors[m]);
          }
        }
      }

      var lines = ocrText.split('\n');
      var firstLine = '';
      for (var n = 0; n < lines.length; n++) {
        var line = lines[n].trim();
        // 最初の実質的なコンテンツを持つ行を探す（3文字以上）
        if (line.length >= 3) {
          firstLine = line;
          break;
        }
      }

      // タイトルを作成（20文字以内、安全に切り詰める）
      var title = 'スクリーンショット';
      if (firstLine.length > 0) {
        // 20文字以内で切り詰める
        if (firstLine.length <= 20) {
          title = firstLine;
        } else {
          title = firstLine.substring(0, 20);
        }
      }

      var summary = generateSummary(ocrText);

      console.log('Analysis result - Title:', title, 'Summary:', summary.substring(0, 50));

      return {
        subCategories: detectedSubs.slice(0, 3),
        majorCategories: majorCats,
        title: title,
        summary: summary,
        tags: detectedSubs.slice(0, 5)
      };
    }

    // 要約生成関数
    function generateSummary(ocrText) {
      if (!ocrText || ocrText.trim().length === 0) {
        return 'テキストが認識できませんでした';
      }

      // 改行を空白に置換（制御文字は削除しない）
      var cleanText = ocrText.replace(/\r\n/g, '\n').replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();

      if (!cleanText || cleanText.length === 0) {
        return 'テキストが認識できませんでした';
      }

      // シンプルに100文字で切り詰める（文字化けを防ぐため複雑な処理を避ける）
      if (cleanText.length <= 100) {
        return cleanText;
      }

      // 100文字で切り詰めて、句読点の位置を探す
      var truncated = cleanText.substring(0, 100);
      var lastPeriod = Math.max(
        truncated.lastIndexOf('。'),
        truncated.lastIndexOf('.')
      );

      // 句読点が見つかればそこまで、見つからなければ100文字で切る
      if (lastPeriod > 50) {
        return truncated.substring(0, lastPeriod + 1);
      } else {
        return truncated + '...';
      }
    }

          var file = files[i];
          console.log('Processing file ' + (i + 1) + '/' + totalFiles + ': ' + file.name);
          var result = await processFile(file, i + 1, totalFiles);

          if (result && result.success) {
            newScreenshots.push(result.screenshot);
            successCount++;
            console.log('File processed successfully: ' + file.name);
          } else {
            failCount++;
            console.warn('File processing failed: ' + file.name, result ? result.error : 'Unknown error');
          }
        }

        // 全ファイル処理後に一度だけUI更新
        if (newScreenshots.length > 0) {
          console.log('Updating UI with ' + newScreenshots.length + ' new screenshots');
          screenshots = newScreenshots.concat(screenshots);
          var saved = saveData();
          if (saved) {
            renderFolders();
            renderSubTags();
            renderCards();
          }
        }

        // 完了メッセージ
        if (failCount === 0) {
          showProcessing('完了！ ' + successCount + '個のファイルを追加しました ✅');
        } else if (successCount > 0) {
          showProcessing('完了: ' + successCount + '個成功、' + failCount + '個失敗 ⚠️');
        } else {
          showProcessing('すべてのファイルの処理に失敗しました 😢');
        }

        setTimeout(hideProcessing, 2000);
        fileInput.value = '';
      } catch (error) {
        console.error('Upload error:', error);
        showProcessing('エラーが発生しました 😢');
        setTimeout(hideProcessing, 3000);
      }
    }

    async function processFile(file, currentIndex, totalCount) {
      try {
        // ファイルサイズチェック (10MB制限)
        if (file.size > 10 * 1024 * 1024) {
          console.warn('File too large: ' + file.name);
          return { success: false, error: 'ファイルサイズが大きすぎます (最大10MB)' };
        }

        // 進捗表示
        if (totalCount > 1) {
          showProcessing('[' + currentIndex + '/' + totalCount + '] ' + file.name + ' を読み込み中...');
        } else {
          showProcessing('画像を読み込み中...');
        }

        var imageData = await new Promise(function(resolve, reject) {
          var reader = new FileReader();
          reader.onload = function(e) {
            resolve(e.target.result);
          };
          reader.onerror = function(e) {
            reject(new Error('ファイル読み込みエラー'));
          };
          reader.readAsDataURL(file);
        });

        // OCR実行
        if (totalCount > 1) {
          showProcessing('[' + currentIndex + '/' + totalCount + '] OCRで文字を認識中... 📖');
        } else {
          showProcessing('OCRで文字を認識中... 📖');
        }

        var result = await Tesseract.recognize(imageData, 'jpn', {
          logger: function(m) {
            if (m.status === 'recognizing text') {
              var progress = Math.round(m.progress * 100);
              if (totalCount > 1) {
                showProcessing('[' + currentIndex + '/' + totalCount + '] 文字認識中... ' + progress + '%');
              } else {
                showProcessing('文字認識中... ' + progress + '%');
              }
            }
            console.log('Tesseract status:', m.status, m.progress);
          },
          langPath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/lang-data',
          corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5',
          workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js'
        });

        var ocrText = result.data.text.trim();

        // OCR結果の詳細ログ
        console.log('=== OCR Result for ' + file.name + ' ===');
        console.log('Confidence:', result.data.confidence);
        console.log('Full text length:', ocrText.length);
        console.log('First 200 chars:', ocrText.substring(0, 200));
        console.log('Language:', result.data.languages);

        if (!ocrText) {
          console.warn('No text recognized in file: ' + file.name);
          return { success: false, error: 'テキスト認識失敗' };
        }

        // 分析
        if (totalCount > 1) {
          showProcessing('[' + currentIndex + '/' + totalCount + '] 内容を分析中... ✨');
        } else {
          showProcessing('AIが内容を分析中... ✨');
        }

        var analysis = analyzeText(ocrText);

        var newScreenshot = {
          id: Date.now() + currentIndex * 1000,
          image: imageData,
          ocrText: ocrText,
          subCategories: analysis.subCategories,
          majorCategories: analysis.majorCategories,
          title: analysis.title,
          summary: analysis.summary,
          tags: analysis.tags,
          createdAt: new Date().toISOString()
        };

        console.log('Screenshot created - Title: ' + analysis.title + ', Summary: ' + analysis.summary.substring(0, 30));

        return { success: true, screenshot: newScreenshot };

      } catch (error) {
        console.error('Processing error for file ' + file.name + ':', error);
        return { success: false, error: error.message || 'Unknown error' };
      }
    }

    function showProcessing(text) {
      processingText.textContent = text;
      processingOverlay.classList.add('active');
    }

    function hideProcessing() {
      processingOverlay.classList.remove('active');
    }

    // ============================================
    // 大ジャンル描画
    // ============================================
    function renderFolders() {
      const counts = {};
      for (const s of screenshots) {
        for (const major of s.majorCategories) {
          counts[major] = (counts[major] || 0) + 1;
        }
      }

      let html = `
        <button class="folder-btn ${selectedMajor === 'all' ? 'active' : ''}" data-major="all">
          <span class="icon">📁</span>
          <span class="name">すべて</span>
          <span class="count">${screenshots.length}</span>
        </button>
      `;

      for (const [name, color] of Object.entries(MAJOR_CATEGORIES)) {
        const count = counts[name] || 0;
        const icon = name.split(' ')[0];
        const label = name.split(' ').slice(1).join(' ');
        html += `
          <button class="folder-btn ${selectedMajor === name ? 'active' : ''}" data-major="${name}">
            <span class="icon">${icon}</span>
            <span class="name">${label}</span>
            <span class="count">${count}</span>
          </button>
        `;
      }

      folderList.innerHTML = html;

      document.querySelectorAll('.folder-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedMajor = btn.dataset.major;
          selectedSub = null;
          renderFolders();
          renderSubTags();
          renderCards();
        });
      });

      totalCount.textContent = `${screenshots.length}件`;
    }

    // ============================================
    // 中ジャンルタグ描画
    // ============================================
    function renderSubTags() {
      let relevantSubs = [];
      
      if (selectedMajor === 'all') {
        relevantSubs = Object.keys(SUB_TO_MAJOR);
      } else {
        for (const [sub, majors] of Object.entries(SUB_TO_MAJOR)) {
          if (majors.includes(selectedMajor)) {
            relevantSubs.push(sub);
          }
        }
      }

      const usedSubs = new Set();
      for (const s of screenshots) {
        for (const sub of s.subCategories) {
          if (relevantSubs.includes(sub)) {
            usedSubs.add(sub);
          }
        }
      }

      let html = '';
      for (const sub of relevantSubs) {
        if (!usedSubs.has(sub)) continue;
        html += `
          <span class="sub-tag ${selectedSub === sub ? 'active' : ''}" data-sub="${sub}">
            ${sub}
          </span>
        `;
      }

      if (!html) {
        html = '<span style="color: #444; font-size: 11px;">タグなし</span>';
      }

      subTags.innerHTML = html;

      document.querySelectorAll('.sub-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          selectedSub = selectedSub === tag.dataset.sub ? null : tag.dataset.sub;
          renderSubTags();
          renderCards();
        });
      });
    }

    // ============================================
    // カード描画
    // ============================================
    function renderCards() {
      const filtered = screenshots.filter(s => {
        const matchesMajor = selectedMajor === 'all' || s.majorCategories.includes(selectedMajor);
        const matchesSub = !selectedSub || s.subCategories.includes(selectedSub);
        const matchesSearch = !searchQuery || 
          s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          s.summary.toLowerCase().includes(searchQuery.toLowerCase()) ||
          s.ocrText.toLowerCase().includes(searchQuery.toLowerCase()) ||
          s.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
        
        return matchesMajor && matchesSub && matchesSearch;
      });

      resultCount.textContent = `${filtered.length}件`;

      if (filtered.length === 0) {
        mainContent.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <p>${screenshots.length === 0 ? 'スクショを追加しよう' : '該当なし'}</p>
            <p>右上の「追加」からアップロード</p>
          </div>
        `;
        return;
      }

      let html = '<div class="card-grid">';
      
      for (const item of filtered) {
        const date = new Date(item.createdAt).toLocaleDateString('ja-JP');
        const mainSub = item.subCategories[0] || '';
        
        html += `
          <div class="card" data-id="${item.id}">
            <div class="card-image">
              <img src="${item.image}" alt="${item.title}" loading="lazy">
              <div class="card-categories">
                ${item.majorCategories.slice(0, 2).map(m => {
                  const color = MAJOR_CATEGORIES[m] || '#666';
                  return `<span class="card-category" style="background: ${color}">${m.split(' ')[0]}</span>`;
                }).join('')}
              </div>
              ${mainSub ? `<span class="card-sub-category">${mainSub}</span>` : ''}
            </div>
            <div class="card-body">
              <h3 class="card-title">${item.title}</h3>
              <p class="card-summary">${item.summary}</p>
              <div class="card-meta">
                <div class="card-tags">
                  ${item.subCategories.slice(0, 2).map(t => `<span class="card-tag">${t}</span>`).join('')}
                </div>
                <span class="card-date">${date}</span>
              </div>
            </div>
          </div>
        `;
      }
      
      html += '</div>';
      mainContent.innerHTML = html;

      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
          const id = parseInt(card.dataset.id);
          selectedItem = screenshots.find(s => s.id === id);
          openModal();
        });
      });
    }

    // ============================================
    // モーダル
    // ============================================
    function openModal() {
      if (!selectedItem) return;

      let catsHtml = selectedItem.majorCategories.map(m => {
        const color = MAJOR_CATEGORIES[m] || '#666';
        return `<span class="modal-category" style="background: ${color}">${m}</span>`;
      }).join('');
      catsHtml += selectedItem.subCategories.map(s => 
        `<span class="modal-sub-cat">${s}</span>`
      ).join('');
      document.getElementById('modal-categories').innerHTML = catsHtml;

      document.getElementById('modal-image').src = selectedItem.image;
      document.getElementById('modal-title').textContent = selectedItem.title;
      document.getElementById('modal-summary').textContent = selectedItem.summary;
      document.getElementById('modal-ocr').textContent = selectedItem.ocrText;
      document.getElementById('modal-date').textContent = `🕐 ${new Date(selectedItem.createdAt).toLocaleString('ja-JP')}`;
      
      const tagsHtml = selectedItem.tags.map(tag => `<span class="info-tag">${tag}</span>`).join('');
      document.getElementById('modal-tags').innerHTML = tagsHtml;

      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      selectedItem = null;
    }

    function handleDelete() {
      if (!selectedItem) return;
      
      screenshots = screenshots.filter(s => s.id !== selectedItem.id);
      saveData();
      renderFolders();
      renderSubTags();
      renderCards();
      closeModal();
    }

    // 初期化実行
    init();
  </script>
</body>
</html>
